version: 2

project_name: pgrun

before:
  hooks:
    - go mod tidy

builds:
  - id: pgrun
    main: ./cmd/pgrun
    binary: pgrun
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/pgrundev/pgrun-cli/internal/cli.Version={{.Version}}

archives:
  - id: pgrun
    formats: [tar.gz]
    # Windows users expect a zip, not a tar.gz.
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "pgrun_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE

# SHA256 checksums — an install script should verify against this before
# chmod +x'ing anything it downloaded.
checksum:
  name_template: "checksums.txt"
  algorithm: sha256

# Homebrew tap + npm publishing are DEFERRED for the v0.1.0 beta — the
# supported install path is `curl -fsSL https://pgrun.dev/install | sh`, which
# pulls the archives + checksums this release uploads. A brew formula
# (pgrundev/homebrew-tap) and @pgrun/cli npm package can be re-added later;
# they were dropped from this config because goreleaser deprecated the inline
# `brews:` key in favor of `homebrew_casks:` and they blocked `goreleaser check`.

# npm (@pgrun/cli) is NOT built by goreleaser itself — goreleaser has no npm
# publisher. The pattern (mirroring pgbot): a release workflow runs this
# build first, then `node npm/build.mjs <version>` reads dist/artifacts.json
# and assembles the per-platform @pgrun/<os>-<arch> packages plus the
# @pgrun/cli wrapper under npm/staging/, which a separate `npm publish`
# step (not present here — publishing is deferred) would push.

release:
  github:
    owner: pgrundev
    name: pgrun-cli

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
